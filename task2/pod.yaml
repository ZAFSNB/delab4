# Простой под с одним контейнером (задание 2, п. 5)
# Pod — минимальная единица работы в Kubernetes: один или несколько
# контейнеров, которые гарантированно запускаются вместе на одной ноде.
apiVersion: v1                 # версия API для объекта core/v1
kind: Pod                      # тип ресурса
metadata:
  name: lab4-web               # имя пода (уникально в пределах namespace)
  labels:
    app: lab4-web              # метка — используется селекторами сервисов и ReplicaSet
spec:                          # желаемое состояние пода
  containers:
    - name: web                # имя контейнера внутри пода
      image: nginx:1.27-alpine # образ из Docker Hub
      ports:
        - containerPort: 80    # порт, который слушает контейнер
      resources:
        requests:              # гарантированные ресурсы (влияют на планирование)
          cpu: 50m
          memory: 64Mi
        limits:                # верхняя граница потребления
          cpu: 200m
          memory: 128Mi
